# Actions done after Mintlify deployment following a push done on `main`.
# This will trigger new commits on `main`, so a new deployment of Mintlify.
name: Post Deployment

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *' # Every day at 11:00 PM UTC
  push:
    branches:
      - 'main'

concurrency:
  group: post-deployment
  cancel-in-progress: false

jobs:
  build-code-samples:
    name: Build code samples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Generate code sample snippets
        run: npm run generate-code-sample-snippets-file

      - name: Commit changes
        run: scripts/commit-changed-files.sh snippets/

  # Fetches the assets the documentation is generated from:
  # - the Meilisearch release assets (OpenAPI spec and error codes files)
  # - the Meilisearch Cloud OpenAPI spec and error codes (from the private meilisearch-cloud repository,
  #   not related to a release)
  # Each changed file is committed separately to keep history clear.
  # We need to wait for build-code-samples to commit first so we can push separate commits
  # (avoid stacking both changes in one run and keep history clear).
  # Runs even if build-code-samples failed: fetching the assets does not
  # depend on the code samples.
  fetch-assets:
    name: Fetch assets
    runs-on: ubuntu-latest
    needs: [build-code-samples]
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Fetch assets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run fetch-assets

      # Pushed right away so a failure in the following steps does not block
      # the release assets and Cloud error codes updates.
      - name: Commit release assets and Cloud error codes changes
        run: >-
          scripts/commit-changed-files.sh
          assets/engine-release-assets/meilisearch-openapi.json
          assets/engine-release-assets/meilisearch-error-codes.json
          assets/cloud-assets/meilisearch-cloud-error-codes.json

      # Validate the Cloud OpenAPI spec before committing it, so a broken
      # spec never lands on main. The Management API Mintlify file is generated from it.
      - name: Validate Cloud OpenAPI spec with Mintlify CLI
        run: npx mint openapi-check assets/cloud-assets/meilisearch-cloud-openapi.yaml

      - name: Commit Cloud OpenAPI spec changes
        run: scripts/commit-changed-files.sh assets/cloud-assets/meilisearch-cloud-openapi.yaml

  # Runs after fetch-assets: generate the Mintlify OpenAPI files of the Meilisearch API and of the
  # Management API with code samples, validate them with mint openapi-check, commit if valid.
  # Runs even if an upstream job failed (it regenerates from whatever is on main),
  # but waits for fetch-assets to finish to avoid concurrent pushes to main.
  generate-and-check-mintlify-openapi:
    name: Generate and check Mintlify OpenAPI files
    runs-on: ubuntu-latest
    needs: [fetch-assets]
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Generate Mintlify OpenAPI files
        run: npm run generate-mintlify-openapi-file

      - name: Validate OpenAPI with Mintlify CLI
        run: npx mint openapi-check assets/engine-release-assets/meilisearch-openapi-mintlify.json

      - name: Validate Management API OpenAPI with Mintlify CLI
        run: npx mint openapi-check assets/cloud-assets/meilisearch-cloud-openapi-mintlify.json

      - name: Commit changes
        run: >-
          scripts/commit-changed-files.sh
          assets/engine-release-assets/meilisearch-openapi-mintlify.json
          assets/cloud-assets/meilisearch-cloud-openapi-mintlify.json

  # Inject the error codes from assets/engine-release-assets/meilisearch-error-codes.json
  # and assets/cloud-assets/meilisearch-cloud-error-codes.json into reference/errors.mdx
  # and reference/management-api-errors.mdx.
  # It also runs when a JSON file is updated manually, so the page never goes stale.
  # It waits for generate-and-check-mintlify-openapi to finish (whatever its result) to
  # avoid concurrent pushes to main, but runs even if an upstream job failed: the
  # generation only depends on the error codes JSON present on main.
  generate-error-codes:
    name: Generate error codes file
    runs-on: ubuntu-latest
    needs: [build-code-samples, generate-and-check-mintlify-openapi]
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Generate error codes file
        run: npm run generate-error-codes

      - name: Commit changes
        run: scripts/commit-changed-files.sh reference/errors.mdx reference/management-api-errors.mdx

  # After the Mintlify OpenAPI file is updated, check if any new routes are missing
  # from docs.json. If so, open a GitHub issue (unless one is already open).
  check-undocumented-routes:
    name: Open issue for undocumented API routes
    runs-on: ubuntu-latest
    needs: [generate-and-check-mintlify-openapi]
    if: ${{ !cancelled() }}
    permissions:
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Check for undocumented routes
        id: coverage
        run: |
          set +e
          output=$(npm run check-openapi-routes-coverage 2>&1)
          status=$?
          set -e
          echo "$output"
          missing=$(echo "$output" | grep '^\s*-' | sed 's/^\s*- //' || true)
          if [ -n "$missing" ]; then
            echo "has_missing=true" >> "$GITHUB_OUTPUT"
            {
              echo "missing_routes<<EOF"
              echo "$missing"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
            echo "has_missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing open issue
        if: steps.coverage.outputs.has_missing == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          count=$(gh issue list --search "New API routes need documentation in:title" --state open --json number --jq 'length')
          echo "open_issues=$count" >> "$GITHUB_OUTPUT"

      - name: Create issue for undocumented routes
        if: steps.coverage.outputs.has_missing == 'true' && steps.existing.outputs.open_issues == '0'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MISSING_ROUTES: ${{ steps.coverage.outputs.missing_routes }}
        run: |
          # Build the route list as markdown
          route_list=""
          while IFS= read -r route; do
            route_list="${route_list}- \`${route}\`
          "
          done <<< "$MISSING_ROUTES"

          gh issue create \
            --title "New API routes need documentation" \
            --body "The OpenAPI spec was updated and the following routes are not yet documented in \`docs.json\`:

          ${route_list}
          **Next steps:**
          1. Add the missing route(s) to \`docs.json\` under the appropriate API reference group
          2. Run \`npm run check-openapi-routes-coverage\` to verify

          _This issue was created automatically by the post-deployment workflow._"

  # Runs at the end of the push chain (after generate-error-codes) so it never pushes
  # to main at the same time as the other jobs. Runs even if an upstream job failed,
  # as long as the workflow was not cancelled.
  update-changelog:
    name: Update changelog if new release exists
    runs-on: ubuntu-latest
    needs: [generate-error-codes]
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Generate changelog
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run generate-changelog

      - name: Commit changes
        run: |
          if git diff --quiet changelog.mdx changelog/ config/navigation.json; then
            echo "No changelog changes detected."
          else
            git config user.name "meili-bot"
            git config user.email "robot@meilisearch.com"
            git add changelog.mdx changelog/ config/navigation.json
            git commit -m "[AUTOMATION POST DEPLOYMENT] Update changelog with latest Meilisearch release"
            git push origin main
          fi
