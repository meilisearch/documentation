name: Lint chat

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "chat/**"
      - ".oxlintrc.json"
      - "package.json"
      - "package-lock.json"

jobs:
  lint-chat:
    name: Lint chat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Lint chat
        run: npm run lint:chat
