# Runs daily and on workflow_dispatch.
# - Job 1: Fails if local code samples are not properly used (route comment → OpenAPI, no comment → snippet in docs).
# - Job 2: Fails if any integration (CLI or SDK) has code samples not present in the local .code-samples.meilisearch.yaml.
# - Job 3: Informational only (never fails) – lists CodeSamples* import keys missing from each integration.
name: Check Docs & integration code sample files

on:
  workflow_dispatch:
  schedule:
    # Every day at 06:00 UTC
    - cron: '0 6 * * *'

jobs:
  # Fails if a code sample's route comment doesn't match a valid OpenAPI path,
  # or if a sample without a route comment isn't referenced in any doc page.
  local-samples-usage:
    name: Local code samples usage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check local code samples are used
        run: npm run check-code-samples-usage

  # Fails if an integration's .code-samples.meilisearch.yaml contains keys absent from
  # the local .code-samples.meilisearch.yaml (those integration samples are useless).
  unused-integration-samples:
    name: Unused code samples in integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Check for unused integration code samples
        run: npm run check-unused-integration-samples

  # Informational only – this job never fails.
  # Lists code sample keys referenced by CodeSamples* imports in the docs that are missing from each integration.
  missing-integration-samples:
    name: "[Info only - never fails] Missing integration code samples"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: List missing integration code samples (informational, never fails)
        run: npm run check-missing-integration-samples
