  "/api/v2/projects":
    get:
      summary: Lists the projects of the accessible teams
      tags:
      - Projects
      operationId: listProjects
      security:
      - personal_access_token: []
      - oauth2:
        - read
      parameters:
      - "$ref": "#/components/parameters/Offset"
      - "$ref": "#/components/parameters/Limit"
      - name: teamId
        in: query
        schema:
          type: integer
          minimum: 0
        required: false
        description: Only returns the projects of this team.
      - name: includeTerminated
        in: query
        schema:
          type: boolean
          default: false
        required: false
        description: Also returns terminated projects, e.g. to read their usage until
          termination.
      responses:
        '200':
          description: projects list
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/Pagination"
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        "$ref": "#/components/schemas/Project"
                  required:
                  - results
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: Creates a project in a team
      tags:
      - Projects
      operationId: createProject
      security:
      - personal_access_token: []
