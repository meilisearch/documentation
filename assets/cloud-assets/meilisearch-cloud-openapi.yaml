      schema:
        type: integer
        minimum: 0
      required: true
    - name: memberId
      in: path
      schema:
        type: string
        format: uuid
      description: The `id` of the member, as returned by the members list.
      required: true
    delete:
      summary: Removes a member from a team
      tags:
      - Team Members
      operationId: removeTeamMember
      security:
      - personal_access_token: []
      - oauth2:
        - write
      responses:
        '204':
          description: member removed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v2/teams":
    get:
      summary: Lists teams the authenticated user can access
      tags:
      - Teams
      operationId: listTeams
      security:
      - personal_access_token: []
      - oauth2:
        - read
      parameters:
      - "$ref": "#/components/parameters/Offset"
      - "$ref": "#/components/parameters/Limit"
      - name: organizationId
        in: query
        schema:
          type: integer
          minimum: 0
        required: false
      responses:
        '200':
          description: teams list
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/Pagination"
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        "$ref": "#/components/schemas/Team"
                  required:
                  - results
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: Creates a team
      tags:
      - Teams
      operationId: createTeam
      security:
      - personal_access_token: []
      - oauth2:
        - write
      parameters: []
      responses:
        '201':
          description: team created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Team"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - organizationId
              properties:
                name:
                  type: string
                organizationId:
                  type: integer
        required: true
  "/api/v2/teams/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: integer
        minimum: 0
      required: true
    get:
      summary: Retrieves a team
      tags:
      - Teams
      operationId: getTeam
      security:
      - personal_access_token: []
      - oauth2:
        - read
      responses:
        '200':
          description: team found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Team"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: Updates a team
      tags:
      - Teams
      operationId: updateTeam
      security:
      - personal_access_token: []
      - oauth2:
        - write
      parameters: []
      responses:
        '200':
          description: team updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Team"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                ownerId:
                  type: string
                  format: uuid
                  description: New owner's uuid, must already be a team member
    delete:
      summary: Deletes a team
      tags:
      - Teams
      operationId: deleteTeam
      security:
      - personal_access_token: []
      - oauth2:
        - write
      responses:
        '204':
          description: team deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
components:
  parameters:
    Offset:
      name: offset
      in: query
      required: false
      description: Number of items to skip.
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return. Values above the maximum are
        capped to it.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  securitySchemes:
    personal_access_token:
      type: http
      scheme: bearer
      description: Personal Access Token (PAT), authenticates as the token's owning
        user.
    oauth2:
      type: oauth2
      description: OAuth2 authorization code flow with PKCE, for partner applications
        acting on behalf of a user. Send the user to the authorization URL in their
        browser. `read` allows GET requests, `write` allows every other method.
      flows:
        authorizationCode:
          authorizationUrl: https://cloud.meilisearch.com/oauth/authorize
          tokenUrl: https://api.meilisearch.com/oauth/token
          refreshUrl: https://api.meilisearch.com/oauth/token
          scopes:
            read: Read access (GET requests)
            write: Write access (all other requests)
  schemas:
    Error:
      type: object
      description: Error body returned by every non-2xx response. Switch on `code`,
        never on `message`.
      properties:
        message:
          type: string
        code:
          type: string
          description: Stable snake_case identifier of the error.
        type:
          type: string
          enum:
          - invalid_request
          - auth
          - internal
        link:
          type: string
          format: uri
          description: Documentation of this error code.
        details:
          type: array
          description: Request fields the error is about. Present whenever the error
            involves request fields.
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
            required:
            - field
            - code
            - message
      required:
      - message
      - code
      - type
      - link
    Pagination:
      type: object
      description: Envelope of every list response, the items being in `results`.
      properties:
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          description: Number of items matching the request.
      required:
      - offset
      - limit
      - total
    Organization:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        identifier:
          type: string
        ownerId:
          type: string
        isAdmin:
          type: boolean
      required:
      - id
      - name
      - identifier
      - ownerId
      - isAdmin
    Team:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        organizationId:
          type: integer
        ownerId:
          type: string
        isAdmin:
          type: boolean
      required:
      - id
      - name
      - organizationId
      - ownerId
      - isAdmin
    TeamMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identifies the member or the pending invitation, e.g. to remove
            it
        email:
          type: string
        name:
          type: string
          nullable: true
          description: "`null` for a pending invitation."
        isOwner:
          type: boolean
          description: Whether the member owns the team.
        status:
          type: string
          enum:
          - accepted
          - invited
        invitedAt:
          type: string
          format: date-time
          nullable: true
          description: "`null` for an accepted member."
      required:
      - id
      - email
      - name
      - isOwner
      - status
      - invitedAt
    PlanFeature:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          type: string
          enum:
          - base
          - search
          - document
          - storage
          - instance_runtime
          - chat_token
          - bandwidth
          - backup
        stripePriceId:
          type: string
          nullable: true
        enabled:
          type: boolean
        nickname:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        productName:
          type: string
          nullable: true
        unitPrice:
          type: number
          nullable: true
        monthlyEstimation:
          type: number
          nullable: true
        transformQuantity:
          type: object
          nullable: true
          description: 'Billed per package of units: the quantity is divided by `divideBy`
            before applying `unitPrice`.'
          properties:
            divideBy:
              type: integer
            round:
              type: string
              enum:
              - up
              - down
      required:
      - id
      - name
      - kind
      - enabled
      - stripePriceId
    Resource:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        displayName:
          type: string
          nullable: true
        plan:
          type: string
          enum:
          - legacy
          - build_plan
          - pro_plan
          - custom_plan
          - grow_plan
          - free_trial
          - enterprise_plan
          - resource_based_plan
        regionId:
          type: integer
        storage:
          type: number
          nullable: true
        memory:
          type: number
          nullable: true
        vcpu:
          type: number
          nullable: true
        fullPlan:
          type: object
          nullable: true
          description: Plan and pricing of the resource. `null` when the resource
            has no public plan.
          properties:
            id:
              type: integer
            name:
              type: string
            code:
              type: string
            features:
              type: array
              items:
                "$ref": "#/components/schemas/PlanFeature"
          required:
          - id
          - name
          - code
          - features
      required:
      - id
      - name
      - plan
      - regionId
    Region:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        awsRegion:
          type: string
        countryCode:
          type: string
        greenLabel:
          type: boolean
        regionUrl:
          type: string
      required:
      - id
      - name
      - awsRegion
      - countryCode
      - greenLabel
      - regionUrl
    MeilisearchVersion:
      type: object
      properties:
        name:
          type: string
        tag:
          type: string
        latest:
          type: boolean
      required:
      - name
      - tag
      - latest
    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        projectUid:
          type: string
        url:
          type: string
          nullable: true
        masterKey:
          type: string
          description: Only returned on project creation and master key endpoints.
        teamId:
          type: integer
        resourceId:
          type: integer
        msVersion:
          type: string
        readOnly:
          type: boolean
        status:
          type: string
          enum:
          - creating
          - waiting_for_end_of_dns_ttl
          - health_checking
          - running
          - changing_plan
          - updating
          - restoring
          - failed
          - update_failed
          - paused
        paused:
          type: boolean
        createdAt:
          type: string
          format: date-time
        terminatedAt:
          type: string
          format: date-time
          nullable: true
        freeTrialEndsAt:
          type: string
          format: date-time
          nullable: true
        resource:
          "$ref": "#/components/schemas/Resource"
      required:
      - id
      - name
      - projectUid
      - teamId
      - resourceId
      - msVersion
      - readOnly
      - status
      - paused
      - createdAt
      - resource
    ProjectUsageDay:
      type: object
      description: Usage of a UTC day. A null quantity means nothing was collected
        that day.
      properties:
        date:
          type: string
          format: date
        runtime:
          type: array
          description: Hours per machine size (resource), each one having its own
            hourly price.
          items:
            type: object
            properties:
              resourceId:
                type: integer
              hours:
                type: number
            required:
            - resourceId
            - hours
        storageGb:
          type: integer
          nullable: true
          description: Provisioned disk.
        bandwidthBytes:
          type: integer
          nullable: true
          description: Outbound bandwidth.
        documents:
          type: integer
          nullable: true
        searches:
          type: integer
          nullable: true
        chatTokens:
          type: integer
          nullable: true
      required:
      - date
      - runtime
      - storageGb
      - bandwidthBytes
      - documents
      - searches
      - chatTokens
    ProjectUsage:
      type: object
      properties:
        projectId:
          type: integer
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: array
          items:
            "$ref": "#/components/schemas/ProjectUsageDay"
      required:
      - projectId
      - from
      - to
      - days
    ProjectCostItem:
      type: object
      description: A feature the project is billed per usage for. Monthly prices (storage,
        documents, base fee) are prorated on the hours the project existed.
      properties:
        kind:
          type: string
          enum:
          - instance_runtime
          - storage
          - bandwidth
          - document
          - search
          - chat_token
          - base
        resourceId:
          type: integer
          description: Machine size of an instance_runtime item.
        quantity:
          type: number
        unit:
          type: string
          enum:
          - hour
          - GB-month
          - MB
          - document-month
          - search
          - token
          - month
        unitPrice:
          type: number
        amount:
          type: number
          description: quantity × unitPrice
      required:
      - kind
      - quantity
      - unit
      - unitPrice
      - amount
    ProjectCost:
      type: object
      properties:
        projectId:
          type: integer
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        currency:
          type: string
          example: USD
        total:
          type: number
        items:
          type: array
          items:
            "$ref": "#/components/schemas/ProjectCostItem"
      required:
      - projectId
      - from
      - to
      - currency
      - total
      - items
security:
- personal_access_token: []
- oauth2:
  - read
  - write
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: api.meilisearch.com
