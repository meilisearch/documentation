              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: Rotates the master key of a project
      tags:
      - Projects
      operationId: rotateProjectMasterKey
      description: Generates a new master key and restarts the instance to apply it.
        The previous master key and every API key derived from it stop working.
      security:
      - personal_access_token: []
      - oauth2:
        - write
      responses:
        '202':
          description: master key rotated, instance restarting
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Project"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '423':
          description: Locked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
