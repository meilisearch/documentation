          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '423':
          description: Locked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - version
              properties:
