      in: path
      schema:
        type: integer
        minimum: 0
      required: true
    get:
      summary: Retrieves a project with its master key
      tags:
      - Projects
      operationId: getProjectMasterKey
      description: Returns the project including its current master key. Restricted
        to team and organization owners.
      security:
      - personal_access_token: []
      - oauth2:
        - read
      responses:
        '200':
          description: project with master key
          content:
            application/json:
              schema:
