  "/api/v2/projects/{projectId}/cost":
    parameters:
    - name: projectId
      in: path
      schema:
        type: integer
        minimum: 0
      required: true
    - name: from
      in: query
      schema:
        type: string
        format: date
      required: false
      description: First UTC day of the window, inclusive. Defaults to the first day
        of the current month.
    - name: to
      in: query
      schema:
        type: string
        format: date
      required: false
      description: Last UTC day of the window, inclusive. Defaults to today. The window
        can not exceed 93 days.
    get:
      summary: Returns the estimated cost of a project usage
      tags:
      - Projects
      operationId: getProjectCost
      description: 'Gross estimation of the cost of the project usage over the window:
        quantity × unit price of the project plan, before free tiers shared across
        the organization, discounts and taxes. The window is the same as the usage
        one.'
      security:
      - personal_access_token: []
      - oauth2:
        - read
      responses:
        '200':
          description: project estimated cost
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProjectCost"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v2/projects/{projectId}/master-key":
    parameters:
