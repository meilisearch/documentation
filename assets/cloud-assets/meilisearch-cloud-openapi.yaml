          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - teamId
              - resourceId
              properties:
                name:
                  type: string
                teamId:
                  type: integer
                resourceId:
                  type: integer
                msVersion:
                  type: string
                  example: v1.54.0
                  description: Name of an active Meilisearch version, as listed by
                    `GET /meilisearch-versions`. Defaults to the latest version.
        required: true
