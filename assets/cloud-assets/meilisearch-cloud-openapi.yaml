---
openapi: 3.0.1
info:
  title: Meilisearch Cloud API V2
  version: v2
  description: |-
    Manages Meilisearch Cloud organizations, teams and projects. Request and response fields are camelCase.

    ## Authentication

    Send `Authorization: Bearer <token>` with a Personal Access Token or an OAuth2 access token. OAuth2 tokens need the `read` scope for GET requests and `write` for every other method.

    ## Pagination

    List endpoints take `offset` and `limit` and return `{ results, offset, limit, total }`.

    ## Errors

    Every non-2xx response has the `Error` body. Read its `code` field to know the exact error. Each operation documents the statuses it can answer. Every endpoint can also answer:

    - `400` `invalid_id`: an id in the path or the query is not an integer.
    - `400` `invalid_body`: the body is not valid JSON.
    - `400` `unknown_field`: the body has a field the endpoint does not accept.
    - `400` `invalid_offset`, `invalid_limit`: invalid pagination parameter on a list endpoint.
    - `401` `missing_authorization_header`, `invalid_token`: no token, or an invalid, expired or revoked one.
    - `403` `forbidden`: the OAuth2 token does not have the scope the method needs.
    - `429` `rate_limited`: over 30 requests per minute per token. Retry after the number of seconds in the `Retry-After` header.
    - `500` `internal`: unexpected error.
tags:
- name: Me
  description: Identity of the token owner.
- name: Organizations
  description: Organizations hold teams and billing.
- name: Teams
  description: Teams hold projects and members.
- name: Team Members
  description: Members and pending invitations of a team.
- name: Projects
  description: Meilisearch instances.
- name: Regions
  description: Regions where a project can be created.
- name: Resources
  description: Machine sizes and their plans, to create a project or change its plan.
- name: Meilisearch Versions
  description: Meilisearch versions a project can run.
paths:
  "/api/v2/me":
    get:
      summary: Retrieves the authenticated user identity
      tags:
      - Me
      operationId: getMe
      security:
      - personal_access_token: []
      - oauth2:
        - read
      responses:
        '200':
          description: current user identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                required:
                - id
                - name
                - email
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
