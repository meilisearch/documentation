                allOf:
                - "$ref": "#/components/schemas/Pagination"
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        "$ref": "#/components/schemas/MeilisearchVersion"
                  required:
                  - results
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
